<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>이번 회차 할 일 — 미리보기</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../">← 공통 수당 안내</a><div class="sample">가상 일정 미리보기 · 실제 개인 안내가 아닙니다</div><header><span id="today"></span><h1>이번 회차,<br>이렇게 준비하세요.</h1><p>현재 일정과 해야 할 일을 한곳에서 확인해요.</p></header><div id="view" aria-live="polite"></div><details class="settings"><summary>미리보기 설정 · 날짜와 활동 바꿔보기</summary><label>확인할 날짜<input type="date" id="date"></label><button id="reset" type="button">오늘 날짜로 보기</button><label>가상 활동계획<select id="plan"><option value="apply">입사지원 2건</option><option value="training">직업훈련 참여</option></select></label><p>회차와 상담일은 미리 정한 가상 일정입니다. 설정은 저장·전송되지 않습니다.</p></details><footer>현재는 Ⅰ유형 화면 구성 예시입니다. 고용24·상담 기록과 연결되어 있지 않으며, 활동·출석·수당 제출 완료 여부는 확인하지 않습니다. 실제 안내는 상담사가 확정한 일정과 계획을 사용해야 합니다.</footer></main><script src="schedule.js"></script><script src="app.js"></script></body></html>
